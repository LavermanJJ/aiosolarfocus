name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing; no API token in secrets
      contents: write # for the GitHub release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tag is the version
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uv publish
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
